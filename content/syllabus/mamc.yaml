course: MAMC
course_full_name: "Master of Arts (Mass Communication)"
university: "Kushabhau Thakre Patrakarita Avam Jansanchar Vishwavidyalaya"
ordinance: "Ordinance No. 08"
batch: "2018-20"
duration: "2 Years (4 Semesters)"
official_syllabus_url: "https://www.ktujm.ac.in/ordinance.htm"

semesters:
  # ===================== SEMESTER I =====================
  - semester: 1
    papers:
      - paper_code: "MAMC-101"
        paper_name: "Communication: Concepts and Processes"
        course_type: "CC"
        max_marks: 100
        pass_marks: 36
        units:
          - unit: 1
            title: "Introduction to Communication"
            topics:
              - "Meaning and Definition of Communication"
              - "Nature and Scope of Communication"
              - "Importance of Communication in Society"
              - "Elements of Communication"
              - "Process of Communication"
              - "Levels of Communication — Intrapersonal, Interpersonal, Group, Mass"
          - unit: 2
            title: "Models of Communication"
            topics:
              - "Linear Models of Communication"
              - "Aristotle Model of Communication"
              - "Lasswell Model of Communication"
              - "Shannon and Weaver Model"
              - "Berlo SMCR Model"
              - "Osgood and Schramm Circular Model"
              - "Westley and MacLean Model"
              - "Dance Helical Model"
              - "Gerbner General Model"
          - unit: 3
            title: "Types and Barriers of Communication"
            topics:
              - "Verbal Communication"
              - "Non-Verbal Communication"
              - "Written Communication"
              - "Visual Communication"
              - "Formal and Informal Communication"
              - "Barriers to Effective Communication"
              - "Overcoming Communication Barriers"
          - unit: 4
            title: "Mass Communication"
            topics:
              - "Meaning and Definition of Mass Communication"
              - "Characteristics of Mass Communication"
              - "Functions of Mass Communication"
              - "Mass Media and Society"
              - "Media and Culture"
              - "Agenda Setting Theory"
              - "Uses and Gratification Theory"
          - unit: 5
            title: "Communication in Indian Context"
            topics:
              - "Traditional Media in India"
              - "Folk Media and Communication"
              - "Communication and Development in India"
              - "Media Scenario in Chhattisgarh"
              - "Role of Communication in National Integration"
              - "Communication Policy and Planning in India"

      - paper_code: "MAMC-102"
        paper_name: "Print Media: History and Development"
        course_type: "CC"
        max_marks: 100
        pass_marks: 36
        units:
          - unit: 1
            title: "Origin and Growth of Press"
            topics:
              - "Invention of Printing Press by Gutenberg"
              - "Origin of Newspapers in Europe"
              - "Growth of Press in England"
              - "Growth of Press in America"
              - "World Press Trends"
          - unit: 2
            title: "History of Indian Press"
            topics:
              - "Beginning of Press in India — James Augustus Hicky"
              - "Role of Press in Indian Independence Movement"
              - "Raja Ram Mohan Roy and Press Freedom"
              - "Bal Gangadhar Tilak and Nationalist Press"
              - "Mahatma Gandhi and Journalism"
              - "Press in Post-Independence India"
          - unit: 3
            title: "Hindi Journalism"
            topics:
              - "Evolution of Hindi Journalism"
              - "Udant Martand — First Hindi Newspaper"
              - "Bharatendu Harishchandra and Hindi Journalism"
              - "Madhavrao Sapre and Chhattisgarh Hindi Press"
              - "Contemporary Hindi Journalism"
              - "Hindi Journalism in Chhattisgarh"
          - unit: 4
            title: "Press Laws and Ethics"
            topics:
              - "Freedom of Press in India — Article 19(1)(a)"
              - "Press Council of India"
              - "Press Laws — Defamation, Contempt of Court, Official Secrets Act"
              - "Right to Information Act 2005"
              - "Ethics in Journalism"
              - "Press Commissions in India — First and Second"
          - unit: 5
            title: "Print Media Management"
            topics:
              - "Newspaper Organization and Management"
              - "Editorial Department — Structure and Functions"
              - "News Agencies in India — PTI, UNI, ANI"
              - "Role of Editor, News Editor, Sub-Editor"
              - "Circulation and Distribution of Newspapers"
              - "Advertising Revenue and Print Economics"

      - paper_code: "MAMC-103"
        paper_name: "Reporting and Editing"
        course_type: "CC"
        max_marks: 100
        pass_marks: 36
        units:
          - unit: 1
            title: "News — Concept and Characteristics"
            topics:
              - "Meaning and Definition of News"
              - "News Values and News Judgement"
              - "Sources of News"
              - "News Gathering Techniques"
              - "Types of News — Hard News, Soft News, Breaking News"
          - unit: 2
            title: "Reporting"
            topics:
              - "Role and Qualities of a Reporter"
              - "Beat Reporting — Crime, Political, Court, Sports"
              - "Investigative Reporting"
              - "Interview Techniques"
              - "Press Conference and Press Release"
              - "Reporting for Rural Areas"
          - unit: 3
            title: "News Writing"
            topics:
              - "Structure of a News Story — Inverted Pyramid"
              - "Lead Writing — Types of Leads"
              - "Five Ws and One H Principle"
              - "Feature Writing"
              - "Editorial Writing"
              - "Column Writing"
          - unit: 4
            title: "Editing Principles"
            topics:
              - "Meaning and Importance of Editing"
              - "Copy Editing and Proof Reading"
              - "Headline Writing — Types and Principles"
              - "Caption Writing"
              - "Use of Photographs in Newspapers"
              - "Page Layout and Makeup"
          - unit: 5
            title: "Practical Journalism"
            topics:
              - "Desk Work and News Desk Operations"
              - "Sub-Editing Process"
              - "Pagination and Desktop Publishing"
              - "Magazine Journalism"
              - "Online News Writing"
              - "Media Convergence in Newsrooms"

      - paper_code: "MAMC-104"
        paper_name: "Media Laws and Ethics"
        course_type: "CC"
        max_marks: 100
        pass_marks: 36
        units:
          - unit: 1
            title: "Constitutional Framework for Media"
            topics:
              - "Fundamental Rights and Freedom of Press"
              - "Article 19(1)(a) — Freedom of Speech and Expression"
              - "Reasonable Restrictions under Article 19(2)"
              - "Right to Information Act 2005"
              - "Freedom of Press — Indian and Global Perspectives"
          - unit: 2
            title: "Media Laws in India"
            topics:
              - "Law of Defamation — Civil and Criminal"
              - "Contempt of Court Act 1971"
              - "Official Secrets Act 1923"
              - "Copyright Act 1957"
              - "Information Technology Act 2000"
              - "Cable Television Networks Regulation Act 1995"
          - unit: 3
            title: "Media Regulatory Bodies"
            topics:
              - "Press Council of India — Composition and Functions"
              - "News Broadcasting Standards Authority (NBSA)"
              - "Central Board of Film Certification (CBFC)"
              - "Telecom Regulatory Authority of India (TRAI)"
              - "Broadcasting Content Complaints Council (BCCC)"
          - unit: 4
            title: "Media Ethics"
            topics:
              - "Ethics and Morality in Journalism"
              - "Codes of Conduct for Journalists"
              - "Sensationalism and Yellow Journalism"
              - "Paid News and Media Trial"
              - "Privacy and Media Intrusion"
              - "Ethical Dilemmas in Journalism"
          - unit: 5
            title: "International Media Law"
            topics:
              - "UNESCO and Freedom of Information"
              - "New World Information and Communication Order (NWICO)"
              - "MacBride Commission Report"
              - "International Press Freedom Index"
              - "Cross-Border Media Regulation"
              - "Digital Rights and Cyber Laws"

      - paper_code: "MAMC-105"
        paper_name: "Media Research Methods"
        course_type: "CC"
        max_marks: 100
        pass_marks: 36
        units:
          - unit: 1
            title: "Introduction to Research"
            topics:
              - "Meaning and Definition of Research"
              - "Types of Research — Basic, Applied, Descriptive, Analytical"
              - "Scientific Method in Social Research"
              - "Research Process and Steps"
              - "Research Problem Formulation"
          - unit: 2
            title: "Research Design"
            topics:
              - "Hypothesis Formulation and Testing"
              - "Variables — Independent, Dependent, Intervening"
              - "Sampling Methods — Probability and Non-Probability"
              - "Population and Sample Size"
              - "Reliability and Validity in Research"
          - unit: 3
            title: "Data Collection Methods"
            topics:
              - "Survey Method and Questionnaire Design"
              - "Interview Method — Structured and Unstructured"
              - "Observation Method"
              - "Content Analysis"
              - "Case Study Method"
              - "Focus Group Discussion"
          - unit: 4
            title: "Data Analysis"
            topics:
              - "Quantitative Data Analysis — Mean, Median, Mode"
              - "Statistical Tools — Chi-Square, Correlation, Regression"
              - "Qualitative Data Analysis"
              - "Data Interpretation and Presentation"
              - "Use of Tables, Graphs and Charts"
          - unit: 5
            title: "Research Report Writing"
            topics:
              - "Structure of a Research Report"
              - "Review of Literature"
              - "Citation and Referencing — APA, MLA"
              - "Bibliography and Footnotes"
              - "Ethics in Research"
              - "Media Research in India — Trends and Issues"

